globals:
  sites:
    - domain: localhost
      indexPrefix: peerdb
      schema: peerdb
      languagePriority:
        en: []
        sl: []
      defaultLanguage: en
      features:
        searchResultsTable: true
        downloadButtons: true
        indexAncestorProperties: true
      roles:
        "":
          ACTION_READ:
            - all
          ACTION_READ_HISTORIC:
            - all
        admin:
          ACTION_CREATE:
            - all
          ACTION_READ_BULK:
            - all
          ACTION_UPDATE:
            - all
          ACTION_UPDATE_PERMISSIONS:
            - all
          ACTION_DELETE:
            - all
